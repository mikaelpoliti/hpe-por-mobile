<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HPE Parts">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>HPE Parts Manager</title>
  <style>
    :root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#cbd5e1;--blue:#2563eb;--green:#15803d;--red:#b91c1c}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
    header{background:#0f172a;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:10}
    h1{font-size:19px;margin:0}.small{font-size:12px;color:#cbd5e1;margin-top:3px}
    main{padding:12px;max-width:850px;margin:auto}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .stat{text-align:center}.stat b{font-size:24px;display:block}.stat span{font-size:11px;color:var(--muted)}
    input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:white}
    button,.button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;background:var(--blue);color:white}
    button.gray{background:#475569} button.red{background:var(--red)} button.green{background:var(--green)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}
    label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}
    .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
    .item{margin-top:10px}.item-head{display:flex;justify-content:space-between;gap:10px}.part{font-weight:800;font-size:17px}.meta{font-size:13px;color:var(--muted);line-height:1.45}
    .badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;height:max-content}.open{background:#fef3c7;color:#92400e}.returned{background:#dcfce7;color:#166534}
    .thumb{width:100%;max-height:190px;object-fit:cover;border-radius:10px;margin-top:9px;border:1px solid var(--line)}
    .bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:20}
    dialog{border:0;border-radius:16px;width:calc(100% - 18px);max-width:720px;padding:0;max-height:92vh}
    dialog::backdrop{background:rgba(15,23,42,.6)} .dialog-body{padding:14px;overflow:auto;max-height:92vh}
    .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .dialog-head h2{font-size:18px}.close{background:#e2e8f0;color:#0f172a;padding:9px 11px}
    #preview{display:none;width:100%;max-height:260px;object-fit:contain;border:1px solid var(--line);border-radius:10px;margin-top:8px}
    .notice{font-size:12px;color:var(--muted);margin-top:8px}
    @media(max-width:420px){.row{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
<header><h1>HPE Parts Manager</h1><div class="small">Returdelar – Mikael Politi</div></header>
<main>
  <div class="stats">
    <div class="card stat"><b id="nTotal">0</b><span>Totalt</span></div>
    <div class="card stat"><b id="nOpen">0</b><span>Ej returnerade</span></div>
    <div class="card stat"><b id="nReturned">0</b><span>Returnerade</span></div>
  </div>

  <div class="card">
    <label>Sök</label>
    <input id="search" placeholder="CNI, RMA, part number, plats..." oninput="render()">
    <label>Status</label>
    <select id="filter" onchange="render()">
      <option value="">Alla</option>
      <option value="open">Ej returnerad</option>
      <option value="returned">Returnerad</option>
    </select>
  </div>

  <div id="list"></div>

  <div class="toolbar">
    <button class="gray" onclick="openImport()">Importera mejllista</button>
    <button class="gray" onclick="exportCSV()">Exportera CSV</button>
    <button class="gray" onclick="backup()">Säkerhetskopia</button>
    <label class="button gray" style="text-align:center">Återställ<input id="restore" type="file" accept=".json" hidden></label>
  </div>
  <div class="notice">Data och bilder lagras lokalt på din iPhone. Gör regelbundet en säkerhetskopia.</div>
</main>

<div class="bottom">
  <button onclick="openForm()">+ Ny del</button>
  <button class="green" onclick="quickPhoto()">📷 Fotografera del</button>
</div>

<dialog id="formDialog">
  <div class="dialog-body">
    <div class="dialog-head"><h2 id="formTitle">Ny del</h2><button class="close" onclick="formDialog.close()">Stäng</button></div>
    <input type="hidden" id="id">
    <div class="row">
      <div><label>CNI / Ticket</label><input id="cni" inputmode="numeric"></div>
      <div><label>Part number</label><input id="part" autocapitalize="characters"></div>
      <div><label>RMA</label><input id="rma" inputmode="numeric"></div>
      <div><label>CNE</label><input id="cne"></div>
      <div><label>CNE Parent</label><input id="parent"></div>
      <div><label>Lagerplats</label><input id="location" placeholder="Bil, garage, hylla..."></div>
      <div><label>Skapad</label><input id="created" type="date"></div>
      <div><label>Intervention</label><input id="intervention" type="date"></div>
      <div><label>Status</label><select id="status"><option value="open">Ej returnerad</option><option value="returned">Returnerad</option></select></div>
      <div><label>Returdatum</label><input id="returnDate" type="date"></div>
      <div class="full"><label>Trackingnummer</label><input id="tracking"></div>
      <div class="full"><label>Foto</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview"></div>
      <div class="full"><label>Anteckningar</label><textarea id="notes" rows="3"></textarea></div>
      <div class="full"><button onclick="save()">Spara</button></div>
      <div class="full"><button class="red" id="deleteBtn" onclick="removeCurrent()" style="display:none">Ta bort posten</button></div>
    </div>
  </div>
</dialog>

<dialog id="importDialog">
  <div class="dialog-body">
    <div class="dialog-head"><h2>Importera HPE-lista</h2><button class="close" onclick="importDialog.close()">Stäng</button></div>
    <p class="notice">Kopiera tabellen från mejlet och klistra in här.</p>
    <textarea id="importText" rows="14" placeholder="CNI  CNE  CNEParent  RMA  Part number..."></textarea>
    <button style="margin-top:10px;width:100%" onclick="importRows()">Importera</button>
  </div>
</dialog>

<script>
const KEY="hpe_parts_iphone_v1";
let parts=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=x=>document.getElementById(x);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function persist(){localStorage.setItem(KEY,JSON.stringify(parts));render()}
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){
 const q=$("search").value.toLowerCase(), f=$("filter").value;
 const arr=parts.filter(p=>(!f||p.status===f)&&(!q||Object.values(p).some(v=>String(v).toLowerCase().includes(q))));
 $("list").innerHTML=arr.length?arr.map(p=>`
 <div class="card item" onclick="openForm('${p.id}')">
   <div class="item-head"><div><div class="part">${esc(p.part||"Ingen part number")}</div><div class="meta">CNI: ${esc(p.cni||"–")}<br>RMA: ${esc(p.rma||"–")}<br>Plats: ${esc(p.location||"–")}</div></div>
   <span class="badge ${p.status==="returned"?"returned":"open"}">${p.status==="returned"?"Returnerad":"Ej returnerad"}</span></div>
   ${p.photo?`<img class="thumb" src="${p.photo}">`:""}
 </div>`).join(""):`<div class="card item meta">Inga delar hittades.</div>`;
 $("nTotal").textContent=parts.length;
 $("nOpen").textContent=parts.filter(p=>p.status!=="returned").length;
 $("nReturned").textContent=parts.filter(p=>p.status==="returned").length;
}
function openForm(id=""){
 const p=parts.find(x=>x.id===id)||{};
 $("formTitle").textContent=id?"Redigera del":"Ny del"; $("id").value=id;
 const map={cni:"cni",part:"part",rma:"rma",cne:"cne",parent:"parent",location:"location",created:"created",intervention:"intervention",status:"status",returnDate:"returnDate",tracking:"tracking",notes:"notes"};
 for(const [field,el] of Object.entries(map)) $(el).value=p[field]|| (field==="status"?"open":"");
 $("preview").src=p.photo||""; $("preview").style.display=p.photo?"block":"none"; $("photo").value="";
 $("deleteBtn").style.display=id?"block":"none"; formDialog.showModal();
}
function quickPhoto(){openForm();setTimeout(()=>$("photo").click(),250)}
$("photo").addEventListener("change",e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader(); r.onload=()=>{$("preview").src=r.result;$("preview").style.display="block"}; r.readAsDataURL(f);
});
function save(){
 const id=$("id").value||uid(), old=parts.find(x=>x.id===id)||{};
 const p={...old,id};
 for(const k of ["cni","part","rma","cne","parent","location","created","intervention","status","returnDate","tracking","notes"]) p[k]=$(k).value.trim();
 p.photo=$("preview").src||old.photo||""; p.updated=today();
 if(!p.cni&&!p.part&&!p.rma){alert("Fyll i minst CNI, part number eller RMA.");return}
 const i=parts.findIndex(x=>x.id===id); if(i>=0)parts[i]=p;else parts.unshift(p);
 persist();formDialog.close();
}
function removeCurrent(){const id=$("id").value;if(id&&confirm("Ta bort posten?")){parts=parts.filter(x=>x.id!==id);persist();formDialog.close()}}
function openImport(){importDialog.showModal()}
function parseDate(v){const p=(v||"").split(/[\/.-]/);return p.length===3?(p[0].length===4?`${p[0]}-${p[1].padStart(2,"0")}-${p[2].padStart(2,"0")}`:`${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`):v}
function importRows(){
 let count=0;
 for(const line of $("importText").value.split(/\r?\n/).filter(Boolean)){
   if(/CNI\s+CNE\s+CNEParent/i.test(line))continue;
   const c=line.split(/\t+|\s{2,}/).map(x=>x.trim()).filter(Boolean); if(c.length<5)continue;
   const p={id:uid(),cni:c[0],cne:c[1],parent:c[2],rma:c[3],part:c[4],created:parseDate(c[8]||""),intervention:parseDate(c[9]||""),location:"",status:"open",returnDate:"",tracking:"",notes:"",photo:""};
   if(!parts.some(x=>x.rma&&x.rma===p.rma)){parts.push(p);count++}
 }
 persist();$("importText").value="";importDialog.close();alert(count+" poster importerades.");
}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){dl(new Blob([JSON.stringify(parts,null,2)],{type:"application/json"}),"HPE_parts_backup.json")}
function exportCSV(){const cols=["cni","cne","parent","rma","part","location","status","created","intervention","returnDate","tracking","notes"];const s=[cols.join(";"),...parts.map(p=>cols.map(k=>`"${String(p[k]||"").replaceAll('"','""')}"`).join(";"))].join("\n");dl(new Blob(["\ufeff"+s],{type:"text/csv"}),"HPE_parts.csv")}
$("restore").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{parts=JSON.parse(r.result);persist();alert("Säkerhetskopian återställd.")}catch{alert("Filen kunde inte läsas.")}};r.readAsText(f)});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
